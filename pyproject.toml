[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minf"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Daniel Probst", email = "daenuprobst@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "einops==0.8.0",
  "elementy==0.0.18",
  "matplotlib==3.10.0",
  "numpy==2.2.2",
  "pandas==2.2.3",
  "Pillow==11.1.0",
  "rdkit==2024.9.4",
  "scikit_learn==1.6.1",
  "scipy==1.15.1",
  "torch==2.5.1",
  "tqdm==4.67.1",
  "yt==4.4.0",
]

[project.urls]
Documentation = "https://github.com/Daniel Probst/minf#readme"
Issues = "https://github.com/Daniel Probst/minf/issues"
Source = "https://github.com/Daniel Probst/minf"

[tool.hatch.version]
path = "src/minf/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/minf tests}"

[tool.coverage.run]
source_pkgs = ["minf", "tests"]
branch = true
parallel = true
omit = [
  "src/minf/__about__.py",
]

[tool.coverage.paths]
minf = ["src/minf", "*/minf/src/minf"]
tests = ["tests", "*/minf/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
